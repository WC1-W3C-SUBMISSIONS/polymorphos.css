<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wealthy Vet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .screen.active {
            display: flex;
        }

        /* Loading Screen */
        .loading-text {
            font-size: 32px;
            text-align: center;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Input Screens */
        .question {
            font-size: 24px;
            margin-bottom: 40px;
            text-align: center;
        }

        .input-field {
            background: transparent;
            border: none;
            border-bottom: 2px solid #333;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            font-size: 20px;
            padding: 10px 0;
            width: 400px;
            max-width: 80vw;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-field:focus {
            border-bottom-color: #666;
        }

        .input-field::placeholder {
            color: transparent;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="screen active" id="loadingScreen">
        <div class="loading-text">Welcome to My Wealthy Vet</div>
    </div>

    <!-- Branch of Service Screen -->
    <div class="screen" id="branchScreen">
        <div class="question">Branch of Service</div>
        <input
            type="text"
            class="input-field"
            id="branchInput"
            autocomplete="off"
        />
    </div>

    <!-- First Name Screen -->
    <div class="screen" id="firstNameScreen">
        <div class="question">First Name</div>
        <input
            type="text"
            class="input-field"
            id="firstNameInput"
            autocomplete="off"
        />
    </div>

    <!-- Last Name Screen -->
    <div class="screen" id="lastNameScreen">
        <div class="question">Last Name</div>
        <input
            type="text"
            class="input-field"
            id="lastNameInput"
            autocomplete="off"
        />
    </div>

    <script>
        // Screens
        const loadingScreen = document.getElementById('loadingScreen');
        const branchScreen = document.getElementById('branchScreen');
        const firstNameScreen = document.getElementById('firstNameScreen');
        const lastNameScreen = document.getElementById('lastNameScreen');

        // Inputs
        const branchInput = document.getElementById('branchInput');
        const firstNameInput = document.getElementById('firstNameInput');
        const lastNameInput = document.getElementById('lastNameInput');

        // Data storage
        const userData = {
            branch: '',
            firstName: '',
            lastName: ''
        };

        // Valid branches
        const validBranches = [
            'army', 'navy', 'air force', 'airforce', 'marine', 'marines',
            'marine corps', 'coast guard', 'coastguard', 'space force', 'spaceforce'
        ];

        // Show screen
        function showScreen(screen) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            screen.classList.add('active');

            // Focus input if exists
            const input = screen.querySelector('.input-field');
            if (input) {
                setTimeout(() => input.focus(), 100);
            }
        }

        // Reset to first name (punishment for invalid input)
        function resetToFirstName() {
            userData.firstName = '';
            userData.lastName = '';
            firstNameInput.value = '';
            lastNameInput.value = '';
            showScreen(firstNameScreen);
        }

        // Validate name (only letters, no numbers or special chars)
        function isValidName(name) {
            return /^[a-zA-Z]+$/.test(name.trim());
        }

        // Branch input handler
        branchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const value = branchInput.value.trim().toLowerCase();

                if (validBranches.includes(value)) {
                    userData.branch = value;
                    showScreen(firstNameScreen);
                } else {
                    // Invalid branch, go to first name anyway
                    showScreen(firstNameScreen);
                }
            }
        });

        // First name input handler
        firstNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const value = firstNameInput.value.trim();

                if (isValidName(value)) {
                    userData.firstName = value;
                    showScreen(lastNameScreen);
                } else {
                    // Invalid input - reset
                    resetToFirstName();
                }
            }
        });

        // Last name input handler
        lastNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const value = lastNameInput.value.trim();

                if (isValidName(value)) {
                    userData.lastName = value;

                    // Data collected - store in localStorage
                    localStorage.setItem('veteranData', JSON.stringify(userData));

                    // TODO: Proceed to next phase
                    alert('Data collected: ' + JSON.stringify(userData));
                } else {
                    // Invalid input - reset to first name
                    resetToFirstName();
                }
            }
        });

        // Prevent any other keys from doing anything except typing
        document.addEventListener('keydown', (e) => {
            // Only allow typing, enter, and backspace/delete
            const allowedKeys = ['Enter', 'Backspace', 'Delete', 'Tab'];
            const isTyping = e.key.length === 1;

            if (!isTyping && !allowedKeys.includes(e.key)) {
                e.preventDefault();
            }
        });

        // Start sequence
        setTimeout(() => {
            showScreen(branchScreen);
        }, 2000); // 2 second loading screen
    </script>
</body>
</html>
